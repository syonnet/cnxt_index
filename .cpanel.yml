---
deployment:
  tasks:
    - export DEPLOYPATH=/home/conexpet/public_html/
    - /bin/cp -f index.html $DEPLOYPATH
    - /bin/cp -f flota.html $DEPLOYPATH
    - /bin/cp -f cobertura.html $DEPLOYPATH
    - /bin/cp -f 404.html $DEPLOYPATH
    - /bin/cp -f styles.css $DEPLOYPATH
    - /bin/cp -f script.js $DEPLOYPATH
    - /bin/cp -f enviar_cotizacion.php $DEPLOYPATH
    - /bin/cp -f .htaccess $DEPLOYPATH
    - /bin/cp -f favicon.ico $DEPLOYPATH
    - /bin/cp -f robots.txt $DEPLOYPATH
    - /bin/cp -f sitemap.xml $DEPLOYPATH
    - /bin/cp -Rf assets $DEPLOYPATH
    - /bin/cp -Rf css $DEPLOYPATH
    - /bin/cp -Rf images $DEPLOYPATH
    - /bin/cp -Rf js $DEPLOYPATH
