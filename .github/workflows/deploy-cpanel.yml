name: 🚀 Despliegue Automático a cPanel (conexpet.com)

on:
  push:
    branches:
      - main

jobs:
  web-deploy:
    name: Sincronizar cambios con cPanel (public_html)
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Obtener última versión del código (main)
        uses: actions/checkout@v4

      - name: 📂 Sincronizar archivos hacia cPanel vía FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            .cpanel.yml
            README.md
            wordpress_respaldo/**
            contactos.conexpet.com/**
            cgi-bin/**
            .well-known/**
